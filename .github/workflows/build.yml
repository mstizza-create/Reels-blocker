name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ReelsBlocker.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
        working-directory: ReelsBlocker
      - run: cp ReelsBlocker/app/build/outputs/apk/debug/app-debug.apk ReelsBlocker.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1-${{ github.run_number }}
          files: ReelsBlocker.apk
